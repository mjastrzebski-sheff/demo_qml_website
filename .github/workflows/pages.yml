# Publishes the site to GitHub Pages on every push to main.
# The published site is website_repo/website/ plus media/ and speaker_prezzies/
# (linked in via symlinks). internal/ is never published.

name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # -L follows the website/media and website/speaker_prezzies symlinks,
      # so the real files get copied into the published site.
      - name: Assemble site
        run: cp -RL website_repo/website _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
